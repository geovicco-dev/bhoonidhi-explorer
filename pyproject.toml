[project]
name = "bhoonidhi-explorer-workspace"
version = "0.1.0"
description = "Workspace root for the Bhoonidhi Explorer API."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "--import-mode=importlib"

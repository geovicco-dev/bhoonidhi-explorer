# Bhoonidhi Explorer in one container: the web app and its API. It reads
# scenes from a STAC API, the public Bhoonidhi STAC API unless STAC_API_URL
# names another. Settings: one .env at the repository root (copy
# .env.example). Run from the repository root:
#
#   docker compose -f deploy/compose.yaml --env-file .env up -d
name: bhoonidhi-explorer

services:
  explorer:
    build:
      context: ..
      dockerfile: deploy/explorer.Dockerfile
    image: ${EXPLORER_IMAGE:-bhoonidhi-explorer}:${EXPLORER_TAG:-local}
    ports:
      - "${EXPLORER_BIND:-127.0.0.1}:${EXPLORER_PORT:-8080}:8080"
    # Lets OPENAI_BASE_URL name a model server on the Docker host, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The model: MODEL_PROVIDER answers, MODEL_FALLBACK takes over when it
      # fails. The server refuses to start when the chosen ones lack a
      # model, address or key, and says which.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      ANTHROPIC_THINKING: ${ANTHROPIC_THINKING:-}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      ANTHROPIC_CACHE_TTL: ${ANTHROPIC_CACHE_TTL:-5m}
      MODEL_FALLBACK_COOLDOWN_S: ${MODEL_FALLBACK_COOLDOWN_S:-300}
      MODEL_FIRST_TOKEN_TIMEOUT_S: ${MODEL_FIRST_TOKEN_TIMEOUT_S:-20}
      MODEL_BUDGET_DAILY_USD: ${MODEL_BUDGET_DAILY_USD:-0}
      MODEL_BUDGET_MONTHLY_USD: ${MODEL_BUDGET_MONTHLY_USD:-0}
      MODEL_HISTORY_TURNS: ${MODEL_HISTORY_TURNS:-0}
      STAC_API_URL: ${STAC_API_URL:-https://bhoonidhi-stac.ecotrakr.in}
      STAC_PUBLIC_URL: ${STAC_PUBLIC_URL:-}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-bhoonidhi-explorer/0.1}
      SESSIONS_DB: /app/data/sessions.db
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-7}
      MODEL_SLOTS: ${MODEL_SLOTS:-4}
      MODEL_QUEUE_MAX: ${MODEL_QUEUE_MAX:-20}
      MODEL_QUEUE_WAIT_S: ${MODEL_QUEUE_WAIT_S:-180}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      # Conversations (SQLite). Back this up.
      - explorer-data:/app/data
      # bhd's product list, kept so a restart while Bhoonidhi is unreachable still has it.
      - bhd-cache:/home/app/.bhoonidhi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The start refreshes the product list (up to 60 s) before the server runs.
      start_period: 90s
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  explorer-data:
  bhd-cache:

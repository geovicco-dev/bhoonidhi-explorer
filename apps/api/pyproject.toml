[project]
name = "bhoonidhi-api"
version = "0.0.1"
description = "FastAPI backend for Bhoonidhi Explorer: conversations and a model-driven agent over the Bhoonidhi scene catalogue."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "openai>=1.54",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The availability labels (Availability enum) and the product list, shared
    # with `bhd`, the command users run to download. Pinned exactly: the API
    # reads the downloader's archive parser, not only its public SDK.
    "bhoonidhi-downloader==0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhoonidhi_api"]
